<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title></title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/administradores/editar.css') }}">
</head>

<body>
<div class="wrapper">

  <header class="home-header">
    <div class="container header-container">
      <img src="{{ url_for('static', filename='img/image1.png') }}" alt="Uai PDV" class="logo-topo">
    </div>
  </header>

  <section class="welcome-bar">
    <div class="container welcome-container">
      <div class="welcome-left">Olá, {{ user_name }}!</div>
      <div class="welcome-center">Selecione o que deseja visualizar hoje:</div>
      <div class="welcome-right">
        <a href="{{ url_for('login_page') }}" class="logout">
          <img src="{{ url_for('static', filename='img/logout.png') }}" alt="Sair">
        </a>
      </div>
    </div>
  </section>

<nav class="main-nav">
    <div class="container">
      <ul>
       <li>
        <a href="{{ url_for('administradores.listar_admins_ui') }}" class="{% if menu == 'admin' %}active{% endif %}">
          LISTAGEM DE ADMINISTRADORES
        </a>
      </li>
        <li>
          <a href="{{ url_for('vendas.listar_vendas_ui') }}" class="{% if menu == 'vendas' %}active{% endif %}">
            VENDAS
          </a>
        </li>
      <li>
        <a href="{{ url_for('produtos.listar_produtos_ui') }}" class="{% if menu == 'estoque' %}active{% endif %}">
          ESTOQUE
        </a>
      </li>
      <li>RELATÓRIOS</li>
    </ul>
  </nav>

  <!-- FORMULÁRIO DE EDIÇÃO DE ADMINISTRADOR -->
  <main class="form-container">
    <h2 class="form-title">EDITAR ADMINISTRADOR</h2>
    <form id="form-editar" class="form-edit">

      <label for="nome">NOME</label>
      <input id="nome" name="nome" type="text" value="{{ admin.nome }}" required>

      <label for="email">E-MAIL</label>
      <input id="email" name="email" type="email" value="{{ admin.email }}" required>

      <label for="senha">SENHA</label>
      <input id="senha" name="senha" type="password">

      <label for="confirmar_senha">CONFIRME A SENHA</label>
      <input id="confirmar_senha" name="confirmar_senha" type="password">

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">EDITAR</button>
        <a href="{{ url_for('administradores.listar_admins_ui') }}" class="btn btn-secondary">CANCELAR</a>
      </div>

    </form>
  </main>

<script>
  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
  }

  document.getElementById('form-editar')
    .addEventListener('submit', async e => {
      e.preventDefault();
      const data = {
        id: "{{ admin.id }}",
        nome: e.target.nome.value,
        email: e.target.email.value,
        senha: e.target.senha.value,
        confirmar_senha: e.target.confirmar_senha.value
      };

      const csrfToken = getCookie('csrf_access_token');

      const resp = await fetch('/admin/editar', {
        method: 'PUT',
        credentials: 'include',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRF-TOKEN': csrfToken
        },
        body: JSON.stringify(data)
      });

      if (!resp.ok) {
        const err = await resp.json();
        return alert(err.message);
      }

      alert('Administrador atualizado com sucesso!');
      window.location.href = '{{ url_for("administradores.listar_admins_ui") }}';
    });
</script>

</div>
</body>
</html>
